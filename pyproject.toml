[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-coach"
version = "0.5.0"
description = "Persistent single-agent job-coaching CLI with structured job-radar artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6", "PyYAML>=6.0", "python-dotenv>=1.0",
  "openai>=1.40", "anthropic>=0.34", "httpx>=0.27",
  "Pillow>=10.0", "pypdf>=4.0", "openpyxl>=3.1", "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = [
  "pywebview>=6.2.1,<7; platform_system == 'Windows'",
  "pythonnet>=3.1,<4; platform_system == 'Windows'",
]

[project.scripts]
agent-coach = "agent_coach.cli:main"
agent-coach-web = "agent_coach.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
