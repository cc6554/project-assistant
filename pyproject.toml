[project]
name = "job-radar-coach"
version = "0.1.0"
description = "校招雷达·学习规划智能体：岗位截图 → 技能差距 → 学习计划 → GitHub 复现项目"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
job-radar = "coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
